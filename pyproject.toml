[project]
name = "theaternacht-umfrage"
version = "0.1.0"
description = ""
authors = [
    { name = "pmurati" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai>=0.0.14",
    "pydantic>=2.6",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "pypdf (>=6.16.1,<7.0.0)",
    "openpyxl (>=3.1,<4.0)",
]

[project.scripts]
theaternacht-umfrage = "theaternacht_umfrage.__main__:main"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "theaternacht_umfrage", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
